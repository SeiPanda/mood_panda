<div>
  <nav class="navbar">
    <a mat-button routerLink="/">
      <div class="title">
        <span class="title-owner">{{ active().name }}&rsquo;s</span> Pandournal
      </div>
    </a>
    <div class="flex-spacer"></div>

    <div class="settings">
      <button
        type="button"
        class="settings-btn"
        [class.active]="settingsOpen()"
        [attr.aria-expanded]="settingsOpen()"
        aria-haspopup="menu"
        title="Einstellungen"
        (click)="toggleSettings()"
      >
        <mat-icon fontSet="material-symbols-outlined">settings</mat-icon>
      </button>

      @if (settingsOpen()) {
        <div class="settings-backdrop" (click)="closeSettings()"></div>
        <div class="settings-menu" role="menu">
          <div class="settings-menu-label">Profil wechseln</div>
          @for (profile of profiles(); track profile.id) {
            <button
              type="button"
              class="settings-menu-item"
              role="menuitemradio"
              [attr.aria-checked]="profile.id === activeId()"
              (click)="switchProfile(profile.id)"
            >
              <mat-icon fontSet="material-symbols-outlined">{{ profile.icon }}</mat-icon>
              <span class="settings-menu-item-text">{{ profile.name }}</span>
              @if (profile.id === activeId()) {
                <mat-icon class="check">check</mat-icon>
              }
            </button>
          }

          <div class="settings-menu-divider"></div>

          <button
            type="button"
            class="settings-menu-item"
            role="menuitem"
            (click)="editActiveProfile()"
          >
            <mat-icon fontSet="material-symbols-outlined">edit</mat-icon>
            <span class="settings-menu-item-text">Profil bearbeiten</span>
          </button>

          <div class="settings-menu-divider"></div>

          <button type="button" class="settings-menu-item" role="menuitem" (click)="exportData()">
            <mat-icon fontSet="material-symbols-outlined">download</mat-icon>
            <span class="settings-menu-item-text">Daten exportieren</span>
          </button>

          <button
            type="button"
            class="settings-menu-item"
            role="menuitem"
            (click)="triggerImport()"
          >
            <mat-icon fontSet="material-symbols-outlined">upload</mat-icon>
            <span class="settings-menu-item-text">Daten importieren</span>
          </button>
        </div>
      }
    </div>
  </nav>

  <input
    #importInput
    type="file"
    accept="application/json"
    hidden
    (change)="onImportFileSelected($event)"
  />
</div>
